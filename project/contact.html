<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Reliable Toolshop Contact 🛠️</title>
    <meta name="author" content="Alejandro Cumana">
    <meta name="description" content="Contact page for the web page for the users to get information and answers questions with the contact form..">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/contact.css">
    <script src="scripts/contact.js" defer></script>
</head>
<body>

    <header>
        <h1>The Reliable Toolshop 🛠️</h1>

        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        
    </header>
    <main>

    <section>
        <h2>Contact Us</h2>
        <p>
        Have questions about our tools or services?
        Please send us a message and we will get back to you soon!
        </p>    

        <form id="contact-form">

            <label for="fullname">Full Name</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                name="subject"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <div id="confirmation"></div>

    </section>

    </main>

    <footer>
         <p>
            &copy;
            <span id="currentyear"></span> 
            Alejandro Cumana | Santiago, Chile 
        </p>

        <p id="lastModified">
        
        </p>
        
        <a href="references.html">References</a>
        
    </footer>
</body>
</html>
